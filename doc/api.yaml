openapi: 3.0.3
info:
  title: Fantastic Coffee (decaffeinated)
  description: Fantastic Coffee (decaffeinated), the skeleton project for Web and Software architecture course
  version: 1.0.0
servers:
  - url: http://localhost:3000



security:
  - BearerAuth: []

paths:
  /session:
    post:
      tags: [Login]
      summary: Log in or create user
      description: | 
        When username already exists, return identifier 
        Or create the user and return new identifier
        Without password, HTTP session or cookie
      operationId: doLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: User logged or registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /users:
    get:
      tags: [Users]
      summary: List users or search by username
      description: |
        Without search, return the available WASAText users.
        When search is supplied, filter by username.
      operationId: getUsers
      parameters:
        - name: search
          in: query
          required: false
          description: Optional case-insensitive substring of a username
          schema:
            type: string
      responses:
        '200':
          description: Users matching the search
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /users/me/username:
    put:
      tags: [Users]
      summary: Change the current users username
      description: The new username must not be used by another user
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsernameRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/me/photo:
    put:
      tags: [Users]
      summary: Change the current users profile photo
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Photo' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations:
    get:
      tags: [Conversations]
      summary: Get conversations of the current user
      description: |
        Return the current users private and group conversations, 
        ordered by the latest message. Each entry 
        contains other users name/group name, photo, and latest 
        message. For photo messags preview indicates a photo more than text
      operationId: getMyConversations
      responses:
        '200':
          description: List of conversations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Conversations]
      summary: Start a private conversation
      description: |
        Start a conversation with existing user. 
        Return the existing private conversation if one already exists 
        between these users
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId]
              properties:
                recipientId:
                  $ref: '#/components/schemas/Identifier'
      responses:
        '201':
          description: Conversation created or found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      summary: Read a conversation and its messages
      description: |
        Only participants may read a conversation. Messages are returned
        in reverse chronological order. Opening the conversation marks
        relevant incoming messages as read by this user.
      operationId: getConversation
      responses:
        '200':
          description: Conversation and messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Messages]
      summary: Send a text or photo message, could be reply
      description: |
        Send a text or photo message in a conversation the user belongs to
        ReplyToMessageId refers to a message in this conversation
        Photo data is represented as base64 JPEG, PNG or GIF
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TextMessageRequest'
                - $ref: '#/components/schemas/PhotoMessageRequest'
      responses:
        '201':
          description: Message was sent successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}/forward:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Messages]
      summary: Forward a message to another conversation
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId]
              properties:
                conversationId: { $ref: '#/components/schemas/Identifier' }
      responses:
        '201':
          description: Forwarded message is created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}/comments:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Messages]
      summary: Add/update my emoji reaction to message
      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoticon]
              properties:
                emoticon:
                  type: string
                  minLength: 1
                  example: '⭐'
      responses:
        '200':
          description: Reaction was created or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Messages]
      summary: Remove my emoji reaction from message
      operationId: uncommentMessage
      responses:
        '204': { description: Reaction removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    delete:
      tags: [Messages]
      summary: Delete a message sent by the current user
      description: User may only delete messages that they sent
      operationId: deleteMessage
      responses:
        '204': { description: Message deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups:
    post:
      tags: [Groups]
      summary: Create group conversation
      description: |
        Create group with any number of other users
        Creator automatically will become a member of group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, memberIds]
              properties:
                name: { $ref: '#/components/schemas/GroupName' }
                memberIds:
                  type: array
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Identifier' }
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Groups]
      summary: Add users to an existing group
      description: Only existing members may add users to group
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberIds]
              properties:
                memberIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Identifier' }
      responses:
        '200':
          description: Updated group members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{groupId}/members/me:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    delete:
      tags: [Groups]
      summary: Leave group
      description: User may leave only group of where they are member
      operationId: leaveGroup
      responses:
        '204': { description: Left group }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{groupId}/name:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      tags: [Groups]
      summary: Change group name
      description: Only group members can change group name
      operationId: setGroupName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/GroupName' }
      responses:
        '200':
          description: Group name was updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{groupId}/photo:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      tags: [Groups]
      summary: Change group photo
      description: Only group members are able to change group photo
      operationId: setGroupPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Photo' }
      responses:
        '200':
          description: Group photo was updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Use the user identifier returned from POST /session as the token,
        for ex: Authorization: Bearer qwerty12345

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Unique identifier of conversation
      schema: { $ref: '#/components/schemas/Identifier' }
    GroupId:
      name: groupId
      in: path
      required: true
      description: Unique identifier of the group
      schema: { $ref: '#/components/schemas/Identifier' }
    MessageId:
      name: messageId
      in: path
      required: true
      description: Unique identifier of the message
      schema: { $ref: '#/components/schemas/Identifier' }

  responses:
    BadRequest:
      description: Invalid/incomplete request
    Unauthorized:
      description: Missing/unknown Bearer user identifir
    Forbidden:
      description: User has no permission to access this resource
    NotFound:
      description: Requested resource does not exist
    Conflict:
      description: Resource conflicts with existing data
    InternalServerError:
      description: Unexpected server error

  schemas:
    Identifier:
      type: string
      minLength: 1
      example: 'qwerty12345'

    Username:
      type: string
      minLength: 3
      maxLength: 16
      example: Maria

    GroupName:
      type: string
      minLength: 1
      example: BestFriends

    LoginRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Username' }

    LoginResponse:
      type: object
      required: [identifier]
      properties:
        identifier: { $ref: '#/components/schemas/Identifier' }

    UsernameRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Username' }

    Photo:
      type: object
      description: |
        Base64-encoded JPEG, PNG, GIF image
      required: [mimeType, data]
      properties:
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/gif]
          example: image/png
        data:
          type: string
          format: byte
          description: Base64-encoded image bytes

    User:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        name: { $ref: '#/components/schemas/Username' }
        photo:
          $ref: '#/components/schemas/Photo'

    Reaction:
      type: object
      required: [user, emoticon]
      properties:
        user: { $ref: '#/components/schemas/User' }
        emoticon:
          type: string
          minLength: 1
          example: '⭐'

    TextMessageRequest:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
          minLength: 1
        replyToMessageId: { $ref: '#/components/schemas/Identifier' }

    PhotoMessageRequest:
      type: object
      required: [type, photo]
      properties:
        type:
          type: string
          enum: [photo]
        photo: { $ref: '#/components/schemas/Photo' }
        replyToMessageId: { $ref: '#/components/schemas/Identifier' }

    Message:
      type: object
      required: [id, conversationId, sender, type, createdAt, reactions, delivered, read]
      description: |
        For sent messages, delivered means all recipients have received
        the message in their conversation list,
        Read means all recipients have opened conversation,
        Received messages also show sender
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        conversationId: { $ref: '#/components/schemas/Identifier' }
        sender: { $ref: '#/components/schemas/User' }
        type:
          type: string
          enum: [text, photo]
        text:
          type: string
          description: Present when type is text
        photo:
          $ref: '#/components/schemas/Photo'
        createdAt:
          type: string
          format: date-time
          example: '2020-01-01T00:00:00Z'
        replyToMessageId: { $ref: '#/components/schemas/Identifier' }
        forwardedFromMessageId: { $ref: '#/components/schemas/Identifier' }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/Reaction' }
        delivered: { type: boolean }
        read: { type: boolean }

    ConversationSummary:
      type: object
      required: [id, type, name, members]
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        type:
          type: string
          enum: [private, group]
        name:
          type: string
          example: BestFriends
        photo:
          $ref: '#/components/schemas/Photo'
        members:
          type: array
          items: { $ref: '#/components/schemas/User' }
        lastMessageAt:
          type: string
          format: date-time
          description: Timestamp of the latest message, when exists
        lastMessagePreview:
          type: string
          description: Text snippet for text messages/an icon marker for photos
          example: Helloooo
        lastMessageType:
          type: string
          enum: [text, photo]

    ConversationDetail:
      type: object
      required: [conversation, messages]
      properties:
        conversation: { $ref: '#/components/schemas/ConversationSummary' }
        messages:
          type: array
          description: All messages, sorted by newest first
          items: { $ref: '#/components/schemas/Message' }
